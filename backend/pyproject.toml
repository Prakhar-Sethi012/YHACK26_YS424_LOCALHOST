[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-nav-backend"
version = "0.1.0"
description = "AEGIS-NAV Backend 2 -- native 2D pathfinding core + FastAPI service"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
